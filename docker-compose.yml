services:
  gateway:
    build:
      context: ./services/gateway
    image: loja-veloz/gateway:1.0.0
    environment:
      PORT: 3000
      ORDERS_URL: http://orders:3001
      PAYMENTS_URL: http://payments:3002
      INVENTORY_URL: http://inventory:3003
    ports:
      - "3000:3000"
    networks: [frontend, backend]
    depends_on:
      orders:
        condition: service_healthy
      payments:
        condition: service_healthy
      inventory:
        condition: service_healthy
    read_only: true
    tmpfs: /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  orders:
    build:
      context: ./services/orders
    image: loja-veloz/orders:1.0.0
    environment:
      PORT: 3001
      DATABASE_URL: postgres://loja:loja_dev_password@postgres:5432/loja_veloz
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  payments:
    build:
      context: ./services/payments
    image: loja-veloz/payments:1.0.0
    environment:
      PORT: 3002
    networks: [backend]
    read_only: true
    tmpfs: /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  inventory:
    build:
      context: ./services/inventory
    image: loja-veloz/inventory:1.0.0
    environment:
      PORT: 3003
    networks: [backend]
    read_only: true
    tmpfs: /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loja_veloz
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: loja_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loja -d loja_veloz"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
