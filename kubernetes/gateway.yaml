apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: loja-veloz
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: gateway
        image: ghcr.io/<GITHUB_USER>/loja-veloz-gateway:1.0.0
        imagePullPolicy: IfNotPresent
        env:
        - {name: PORT, value: 3000}
         - {name: ORDERS_URL, valueFrom: {configMapKeyRef: {name: loja-veloz-config, key: ORDERS_URL}}}
         - {name: PAYMENTS_URL, valueFrom: {configMapKeyRef: {name: loja-veloz-config, key: PAYMENTS_URL}}}
         - {name: INVENTORY_URL, valueFrom: {configMapKeyRef: {name: loja-veloz-config, key: INVENTORY_URL}}}
        ports: [{containerPort: 3000}]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        readinessProbe:
          httpGet: {path: /health, port: 3000}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 3000}
          initialDelaySeconds: 15
          periodSeconds: 20
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
          readOnlyRootFilesystem: true
          seccompProfile: {type: RuntimeDefault}
        volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: loja-veloz
spec:
  selector: {app: gateway}
  ports: [{port: 3000, targetPort: 3000}]
